name = "github-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Custom domains are listed together because Wrangler replaces dashboard
# routes with the ones defined here; omitting one would detach it.
routes = [
  { pattern = "gh.gitcafe.ink", custom_domain = true },
  { pattern = "api.gh.gitcafe.ink", custom_domain = true },
  { pattern = "raw.gh.gitcafe.ink", custom_domain = true },
  { pattern = "gist.gh.gitcafe.ink", custom_domain = true },
  { pattern = "ghassets.gitcafe.ink", custom_domain = true },
  { pattern = "ghcollector.gitcafe.ink", custom_domain = true },
]

# Smart Placement moves execution near the upstream origin (GitHub) when
# traffic volume is sufficient. Region/city selection is not possible.
[placement]
mode = "smart"

[observability]
enabled = true
